name: Build LAN Drop (APK + EXE)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inject version into updater.py (EXE)
        shell: bash
        run: |
          VER="v$(date +'%Y.%m.%d')"
          sed -i "s/^CURRENT_VERSION = .*/CURRENT_VERSION = \"${VER#v}\"/" updater.py
          grep -n "CURRENT_VERSION" updater.py

      - name: Build Windows exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconfirm --windowed --icon landrop.ico --name LANDrop --add-data "qrcode.min.js;." landrop.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: landrop-exe
          path: dist/LANDrop.exe
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev cmake build-essential openjdk-17-jdk

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython>=3.0,<3.1"

      - name: Inject version into apk/updater.py
        run: |
          VER="v$(date +'%Y.%m.%d')"
          sed -i "s/^CURRENT_VERSION = .*/CURRENT_VERSION = \"${VER#v}\"/" apk/updater.py
          grep -n "CURRENT_VERSION" apk/updater.py

      - name: Build APK (debug)
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log | tail -5
          ls -la bin/

      - name: Diagnose on failure
        if: failure()
        run: |
          echo "=== disk ==="; df -h / || true
          echo "=== memory ==="; free -h || true
          echo "=== oom ==="; (dmesg 2>/dev/null | grep -iE "killed process|out of memory" | tail -10) || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landrop-apk
          path: bin/*.apk
          if-no-files-found: ignore
