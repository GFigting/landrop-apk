name: Build LAN Drop (APK + EXE)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Windows exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconfirm --windowed --icon landrop.ico --name LANDrop --add-data "qrcode.min.js;." landrop.py

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: landrop-exe
          path: dist/LANDrop.exe
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev cmake build-essential openjdk-17-jdk

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython>=3.0,<3.1"

      - name: Build APK (debug)
        run: |
          set -o pipefail
          yes | buildozer android debug | tee build.log | tail -5
          ls -la bin/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landrop-apk
          path: bin/*.apk
          if-no-files-found: ignore
