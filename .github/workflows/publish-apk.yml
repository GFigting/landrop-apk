name: Publish APK and EXE to download branch

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Find latest successful build
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(gh api "repos/${{ github.repository }}/actions/workflows/build-apk.yml/runs?status=success&per_page=1" -q '.workflow_runs[0].id')
          echo "Using build run: $RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact from latest successful build
        uses: actions/download-artifact@v4
        with:
          name: landrop-apk
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download EXE artifact from latest successful build
        uses: actions/download-artifact@v4
        with:
          name: landrop-exe
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: exe

      - name: Publish to download branch
        run: |
          ls -la; ls -la exe
          APKFILE=$(ls *.apk | head -1)
          cp "$APKFILE" LANDrop-arm64.apk
          EXEFILE=$(ls exe/*.exe | head -1)
          cp "$EXEFILE" LANDrop.exe
          VER="v$(date +'%Y.%m.%d')"
          BARE="${VER#v}"
          cat > version.json <<EOF
          {
            "version": "$BARE",
            "tag": "$VER",
            "date": "$(date +'%Y-%m-%d')",
            "notes": "LAN Drop $VER",
            "download_page": "https://github.com/GFigting/landrop-apk/releases/tag/$VER",
            "apk_url": "https://gfigting.github.io/landrop-apk/LANDrop-arm64.apk",
            "exe_url": "https://gfigting.github.io/landrop-apk/LANDrop.exe"
          }
          EOF
          git config user.name "GFigting"
          git config user.email "kunpeng20327@163.com"
          git checkout -q --orphan download
          git rm -rf --cached . -q || true
          git add -f LANDrop-arm64.apk LANDrop.exe version.json
          git commit -q -m "APK+EXE build $VER $(date -u '+%F %H:%M') UTC"
          git push -q -f origin download
          echo "published LANDrop-arm64.apk + LANDrop.exe + version.json to download branch"
